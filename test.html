<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        Jira Review - {issue_key}
    </title>
    <style>
        body {
        {
            font-family: Arial,
            Helvetica,
            sans-serif;

            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;

            line-height: 1.6;
        }
        }

        .card {
        {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        }

        .label {
        {
            font-weight: bold;
        }
        }

        pre {
        {
            background: #f5f5f5;
            padding: 20px;
            overflow-x: auto;
            border-radius: 6px;
        }
        }
    </style>
</head>
<body>
<h1>Jira Review</h1>
<div class="card">
    <p>
        <span class="label">Issue:</span>
        {issue_key}
    </p>
    <p>
        <span class="label">Project:</span>
        {project}
    </p>
    <p>
        <span class="label">Summary:</span>
        {summary}
    </p>
    <p>
        <span class="label">Status:</span>
        {status}
    </p>
    <p>
        <span class="label">Jira URL:</span>
        <a href="{html.escape(jira_url)}">
            {html.escape(jira_url)}
        </a>
    </p>
</div>
<div class="card">
    <h2>Description</h2>
    <p>
        {description}
    </p>
</div>
<div class="card">
    <h2>Raw Jira JSON</h2>
    <pre>{raw_json}</pre>
</div>
</body>
</html>
